---

name: Build Windows Installer

"on":
  release:
    types: [published]
  workflow_dispatch:
  # Overlay: the fork's unofficial installer, see OVERLAY.md.
  push:
    tags:
      - overlay-build

jobs:
  build:
    # Overlay: official releases only upstream, only the overlay build on a fork.
    if: >-
      (github.repository == 'flxzt/rnote') != (github.ref == 'refs/tags/overlay-build')
    runs-on: windows-2025
    permissions:
      # needed for uploading release artifact
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install Inno 6
        id: install_inno
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\") {
            echo "inno already installed"
          } else {
            winget install -e --id JRSoftware.InnoSetup -v 6.4.3 --accept-package-agreements `
              --accept-source-agreements --disable-interactivity --scope machine
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\") {
              echo "inno installed successfully"
            } else {
              throw "could not find inno's installation folder"
            }
          }

      - name: Set installer name
        id: set_installer_name
        shell: bash
        run: |
          echo "name=rnote-win-installer-$(echo ${GITHUB_REF_NAME#v} \
            | sed -e 's/[^A-Za-z0-9._-]/_/g')-x86_64" >> $GITHUB_OUTPUT

      - name: Setup MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          release: false
          update: true
          msystem: UCRT64
          install: |
            just

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: 1.99-gnu

      - name: Configure PATH
        run: echo "export PATH=$PATH:/c/Users/$USER/.cargo/bin:/c/Program\ Files\ \(x86\)/Inno\ Setup\ 6" > ~/.bashrc

      - name: Checkout
        uses: actions/checkout@v6

      - name: Prerequisites
        run: |
          just ci=true prerequisites-win

      - name: Setup
        run: just ci=true setup-win-installer '${{ steps.set_installer_name.outputs.name }}'

      # Overlay: About dialog reads e.g. 0.15.0+overlay-29ea24a; installs as "Rnote (overlay)".
      - name: Mark overlay build
        if: github.ref == 'refs/tags/overlay-build'
        run: >-
          just configure -Dwin-installer-identity=overlay
          -Dversion-extra=+overlay-$(git rev-parse --short=7 HEAD)

      - name: Build
        run: just ci=true build

      - name: Build installer
        run: just ci=true build-win-installer

      - name: Upload installer (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: rnote-win-installer-artifact
          path: _mesonbuild/${{ steps.set_installer_name.outputs.name }}.exe
          if-no-files-found: error

      - name: Upload installer (release asset)
        if: ${{ github.event_name == 'release' }}
        shell: powershell
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload ${{ github.ref_name }} _mesonbuild/${{ steps.set_installer_name.outputs.name }}.exe

      # Overlay: one unofficial prerelease, replaced on every run.
      - name: Publish overlay installer
        if: github.ref == 'refs/tags/overlay-build'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INSTALLER: _mesonbuild/${{ steps.set_installer_name.outputs.name }}.exe
        run: |
          notes="Unofficial build of ${GITHUB_REPOSITORY}: Rnote with local patches, commit ${GITHUB_SHA}.
          Not an Rnote release. Official releases: https://github.com/flxzt/rnote/releases"
          if gh release view overlay-build >/dev/null 2>&1; then
            gh release edit overlay-build --notes "${notes}"
          else
            gh release create overlay-build --verify-tag --prerelease \
              --title "Unofficial overlay build" --notes "${notes}"
          fi
          gh release upload overlay-build "${INSTALLER}" --clobber
