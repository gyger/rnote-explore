---

name: Exploration Windows Installer

# Builds a Windows installer for a tagged state of the `exploration`
# integration branch. Tagging is the deliberate act - pushes do not build.
#
#   git tag exp-2026-09-11 && git push origin exp-2026-09-11
#     -> rnote-win-installer-exp-2026-09-11+zoom-window-x86_64.exe
#     -> About dialog: 0.15.0+zoom-window (exp-2026-09-11)
#
# The tag names the build; the feature list is derived from the merges, so
# it cannot drift from what is actually in the binary. Artifact only -
# this branch is never released.

"on":
  push:
    tags:
      - "exp-*"

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Install Inno 6
        shell: pwsh
        run: |
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\") {
            echo "inno already installed"
          } else {
            winget install -e --id JRSoftware.InnoSetup -v 6.4.3 --accept-package-agreements `
              --accept-source-agreements --disable-interactivity --scope machine
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\") {
              echo "inno installed successfully"
            } else {
              throw "could not find inno's installation folder"
            }
          }

      - name: Checkout
        uses: actions/checkout@v6
        with:
          # Full history: the version is derived from the merge commits.
          fetch-depth: 0

      - name: Set installer name and version
        id: build_identity
        shell: bash
        run: |
          git fetch --no-tags --quiet origin \
            +refs/heads/main:refs/remotes/origin/main \
            +refs/heads/exploration:refs/remotes/origin/exploration
          # A tag carries no branch, so refuse anything not on exploration.
          if ! git merge-base --is-ancestor HEAD origin/exploration; then
            echo "::error title=Wrong branch::${GITHUB_REF_NAME} is not on exploration"
            exit 1
          fi
          base="$(git merge-base origin/main HEAD)"
          # Every feature enters `exploration` as a merge, so its subject
          # ("Merge branch 'zoom-window' into exploration") is the source of
          # truth for the name. Features appear in merge order; a re-merged
          # branch keeps its first position; an 'origin/' prefix is stripped;
          # merging main in is an update, not a feature, so it is dropped.
          features="$(git log --merges --reverse --format=%s "${base}..HEAD" \
            | sed -n "s/^Merge \(remote-tracking \)\?branch '\(origin\/\)\?\([^']*\)'.*/\3/p" \
            | awk '$0 != "main" && !seen[$0]++' \
            | sed -e 's/^/+/' | tr -d '\n')"
          name="rnote-win-installer-${GITHUB_REF_NAME}${features}-x86_64"
          echo "name=$(echo "${name}" | sed -e 's/[^A-Za-z0-9._+-]/_/g')" >> $GITHUB_OUTPUT
          # Shown in the About dialog, appended to the project version.
          echo "version_extra=${features} (${GITHUB_REF_NAME})" >> $GITHUB_OUTPUT

      - name: Setup MSYS2
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c
        with:
          release: false
          update: true
          install: |
            mingw-w64-x86_64-binutils

      - name: Install rust toolchain
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.95-gnu

      - name: Configure PATH
        run: echo "export PATH=$PATH:/c/Users/$USER/.cargo/bin:/c/Program\ Files\ \(x86\)/Inno\ Setup\ 6" > ~/.bashrc

      - name: Prerequisites
        run: |
          cargo install --locked just
          just ci=true prerequisites-win

      - name: Setup
        run: |
          just ci=true setup-win-installer '${{ steps.build_identity.outputs.name }}'
          just configure -Dversion-extra='${{ steps.build_identity.outputs.version_extra }}'

      - name: Build
        run: just ci=true build

      - name: Build installer
        run: just ci=true build-win-installer

      - name: Upload installer (workflow artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.build_identity.outputs.name }}
          path: _mesonbuild/${{ steps.build_identity.outputs.name }}.exe
          if-no-files-found: error
